openapi: 3.1.0
info:
  title: Kosmos API — Complaint Handling, Repair Verification, Billing & Commission
  version: 0.3.0
  description: |
    Kontrak layanan SOAML untuk proses bisnis Kosmos.
    Autentikasi: Bearer JWT dari Supabase Auth (login Google), atau JWT demo dari /auth/demo-login bila DEMO_MODE=true.
    Tag menunjukkan layer service hasil Deliverable 1:
    Task (Handle Maintenance Request, Complete and Settle Maintenance, Rent Billing),
    Micro (Technician Matching, Cost Estimation, Evidence Verification, Commission Calculation),
    Entity (Tenant and Lease, Complaint Ticket, Technician, Work Order, Invoice, Rent Invoice, Payment, Financial Ledger),
    Utility (Media Storage, AI Classification, Notification).
    Microservice dipanggil in-process oleh Task, jadi tidak punya endpoint HTTP sendiri.
    Sumber kebenaran untuk tipe frontend (openapi-typescript) dan implementasi FastAPI.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: >-
      Login Google lewat Supabase Auth. Frontend mengirim JWT Supabase sebagai Bearer token,
      backend memverifikasinya lalu mencocokkan email dengan tabel pengguna untuk menentukan role.
  - name: Auth (demo)
    description: Login cepat dengan akun demo. Hanya tersedia bila server berjalan dengan DEMO_MODE=true (404 bila tidak).
  - name: Dev (demo)
    description: Alat bantu demo. Hanya tersedia bila DEMO_MODE=true.
  - name: "Task: Handle Maintenance Request"
  - name: "Task: Complete and Settle Maintenance"
  - name: "Task: Rent Billing"
  - name: "Entity: Tenant and Lease"
  - name: "Entity: Complaint Ticket"
  - name: "Entity: Work Order"
  - name: "Entity: Invoice"
  - name: "Entity: Rent Invoice"
  - name: "Entity: Financial Ledger"
  - name: "Utility: Media Storage"
  - name: "Utility: AI Classification"
  - name: "Utility: Notification"

paths:
  /auth/demo-accounts:
    get:
      tags: [Auth (demo)]
      operationId: listDemoAccounts
      security: []
      summary: Daftar akun demo untuk halaman login
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AkunDemo" }

  /auth/demo-login:
    post:
      tags: [Auth (demo)]
      operationId: demoLogin
      security: []
      summary: Masuk sebagai akun demo dan menerima token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoLoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "404": { $ref: "#/components/responses/Error" }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getPenggunaSaya
      summary: >-
        Pengguna yang sedang login beserta role-nya. Dipanggil frontend setelah login Google.
        403 EMAIL_BELUM_TERDAFTAR bila email Google belum didaftarkan pemilik atau admin.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PenggunaSaya" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /hmr/keluhan:
    post:
      tags: ["Task: Handle Maintenance Request"]
      operationId: ajukanKeluhan
      summary: Ajukan keluhan (orkestrasi validasi sewa, media, tiket, klasifikasi AI, notifikasi)
      description: |
        Operasi Add Keluhan (non-agnostic). Mengembalikan hasil "diterima" (201) beserta tiket,
        atau "ditolak" (200) bila sewa unit tidak aktif. Field trace berisi jejak pemanggilan service.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/KeluhanRequest" }
      responses:
        "201":
          description: Keluhan diterima dan tiket dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeluhanResponse" }
        "200":
          description: Keluhan ditolak (sewa tidak aktif)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeluhanResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /hmr/tiket/{id_tiket}/status:
    post:
      tags: ["Task: Handle Maintenance Request"]
      operationId: ubahStatusTiket
      summary: >-
        Pemilik menutup tiket tanpa teknisi (selesai) atau membatalkannya beserta work order yang berjalan. Bila teknisi
        sudah tiba di lokasi, pembatalan menerbitkan invoice biaya kunjungan ke pemilik
      parameters:
        - $ref: "#/components/parameters/IdTiket"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UbahStatusRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TiketDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /hmr/tiket/{id_tiket}/buka-ulang:
    post:
      tags: ["Task: Handle Maintenance Request"]
      operationId: bukaUlangTiket
      summary: >-
        Penghuni membuka ulang tiket yang ditutup pemilik tanpa teknisi (paling lama 7 hari setelah ditutup).
        Tiket kembali ke status diklasifikasi dan pemilik dikabari.
      parameters:
        - $ref: "#/components/parameters/IdTiket"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BukaUlangRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TiketDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /hmr/tiket/{id_tiket}/klasifikasi-ulang:
    post:
      tags: ["Task: Handle Maintenance Request"]
      operationId: klasifikasiUlang
      summary: Jalankan ulang klasifikasi AI untuk tiket berstatus "dibuat"
      parameters:
        - $ref: "#/components/parameters/IdTiket"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TiketDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /hmr/tiket/{id_tiket}/estimasi:
    get:
      tags: ["Task: Handle Maintenance Request"]
      operationId: getEstimasiTiket
      summary: Get Estimasi Biaya terakhir untuk tiket (null bila belum dicarikan teknisi)
      parameters:
        - $ref: "#/components/parameters/IdTiket"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EstimasiBiaya"
                  - type: "null"
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: ["Task: Handle Maintenance Request"]
      operationId: buatEstimasi
      summary: Cari teknisi terverifikasi terdekat, hitung estimasi biaya, lalu sajikan ke pemilik (dashboard + WA)
      description: |
        Orkestrasi Get Tiket, Get Teknisi Tersedia, Get Status Verifikasi Teknisi, Match Teknisi (Micro),
        Estimate Biaya (Micro), lalu Notification ke pemilik. Hanya untuk tiket berstatus "diklasifikasi".
      parameters:
        - $ref: "#/components/parameters/IdTiket"
      responses:
        "201":
          description: Estimasi dibuat dan menunggu persetujuan pemilik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstimasiResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /hmr/estimasi/{id_estimasi}/persetujuan:
    post:
      tags: ["Task: Handle Maintenance Request"]
      operationId: setPersetujuanBiaya
      summary: Set Persetujuan Biaya. Disetujui membuat work order, ditolak membatalkan perbaikan
      parameters:
        - name: id_estimasi
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersetujuanRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersetujuanResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /hmr/work-order/{id_work_order}/jadwal:
    post:
      tags: ["Task: Handle Maintenance Request"]
      operationId: konfirmasiJadwal
      summary: Penghuni mengonfirmasi jadwal kunjungan teknisi (Set Jadwal Kunjungan)
      parameters:
        - $ref: "#/components/parameters/IdWorkOrder"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JadwalRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /hmr/work-order/{id_work_order}/biaya-tambahan/{id_tambahan}/persetujuan:
    post:
      tags: ["Task: Handle Maintenance Request"]
      operationId: setPersetujuanBiayaTambahan
      summary: Pemilik menyetujui atau menolak biaya tambahan yang diajukan teknisi. Disetujui menambah biaya final
      parameters:
        - $ref: "#/components/parameters/IdWorkOrder"
        - name: id_tambahan
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersetujuanRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /csm/work-order/{id_work_order}/biaya-tambahan:
    post:
      tags: ["Task: Complete and Settle Maintenance"]
      operationId: ajukanBiayaTambahan
      summary: Teknisi mengajukan biaya tambahan di luar estimasi (saat dikerjakan). Pemilik harus memutuskan sebelum menerima hasil
      parameters:
        - $ref: "#/components/parameters/IdWorkOrder"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BiayaTambahanRequest" }
      responses:
        "201":
          description: Diajukan, menunggu persetujuan pemilik
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /csm/work-order/{id_work_order}/log:
    post:
      tags: ["Task: Complete and Settle Maintenance"]
      operationId: catatLogServis
      summary: Teknisi mencatat log servis (Add Log Servis) lalu progres dikabarkan
      parameters:
        - $ref: "#/components/parameters/IdWorkOrder"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /csm/work-order/{id_work_order}/bukti:
    post:
      tags: ["Task: Complete and Settle Maintenance"]
      operationId: unggahBukti
      summary: Teknisi mengunggah foto sebelum dan sesudah, lalu Evidence Verification memeriksanya
      parameters:
        - $ref: "#/components/parameters/IdWorkOrder"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/BuktiRequest" }
      responses:
        "200":
          description: Bukti diperiksa. Lihat field verifikasi.valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuktiResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /csm/work-order/{id_work_order}/konfirmasi:
    post:
      tags: ["Task: Complete and Settle Maintenance"]
      operationId: setKonfirmasiSelesai
      summary: >-
        Penghuni mengonfirmasi perbaikan selesai (work order menunggu_pemilik) atau belum beres (kembali dikerjakan).
        Konfirmasi penghuni tidak menerbitkan invoice; invoice terbit saat pemilik menerima hasil
      parameters:
        - $ref: "#/components/parameters/IdWorkOrder"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KonfirmasiRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KonfirmasiResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /csm/work-order/{id_work_order}/terima:
    post:
      tags: ["Task: Complete and Settle Maintenance"]
      operationId: setPenerimaanPemilik
      summary: >-
        Pemilik menerima hasil perbaikan (menutup tiket, menghitung komisi, menerbitkan invoice ke pemilik) atau meminta
        perbaikan ulang. Bisa dari menunggu_pemilik, atau dari menunggu_konfirmasi bila penghuni belum merespons.
        Ditolak (409) selama masih ada biaya tambahan yang belum diputuskan
      parameters:
        - $ref: "#/components/parameters/IdWorkOrder"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PenerimaanRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KonfirmasiResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /csm/invoice/{id_invoice}/bayar:
    post:
      tags: ["Task: Complete and Settle Maintenance"]
      operationId: bayarInvoice
      summary: Pemilik membayar invoice via payment gateway, verifikasi, rekonsiliasi, catat ke laporan kas, kirim notifikasi lunas
      parameters:
        - $ref: "#/components/parameters/IdInvoice"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BayarRequest" }
      responses:
        "200":
          description: Hasil pembayaran (berhasil atau gagal)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BayarResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /work-order:
    get:
      tags: ["Entity: Work Order"]
      operationId: listWorkOrder
      summary: Daftar work order (teknisi miliknya, penghuni unitnya, pemilik propertinya)
      parameters:
        - name: id_tiket
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkOrder" }

  /work-order/{id_work_order}:
    get:
      tags: ["Entity: Work Order"]
      operationId: getWorkOrder
      summary: Get Work Order beserta log servis (Get Progress Servis) dan bukti
      parameters:
        - $ref: "#/components/parameters/IdWorkOrder"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "404": { $ref: "#/components/responses/Error" }

  /csm/invoice/bayar-sekaligus:
    post:
      tags: ["Task: Complete and Settle Maintenance"]
      operationId: bayarInvoiceSekaligus
      summary: >-
        Pemilik membayar beberapa invoice perbaikan dalam satu transaksi payment gateway. Semua invoice harus milik
        pemilik dan belum lunas. Berhasil: semua lunas sekaligus (satu ref gateway); gagal: tidak ada yang lunas
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BayarSekaligusRequest" }
      responses:
        "200":
          description: Hasil pembayaran (berhasil atau gagal)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BayarSekaligusResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /rb/tagihan-sewa/terbitkan:
    post:
      tags: ["Task: Rent Billing"]
      operationId: terbitkanTagihanSewa
      summary: >-
        Pemilik menerbitkan tagihan sewa bulan berjalan untuk semua sewa aktif di propertinya yang belum ditagih
        (idempoten per sewa per periode), lalu penghuni dikabari
      responses:
        "201":
          description: Tagihan yang baru dibuat (bisa kosong bila semua sudah ditagih)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerbitkanSewaResponse" }
        "403": { $ref: "#/components/responses/Error" }

  /rb/tagihan-sewa/{id_tagihan}/bayar:
    post:
      tags: ["Task: Rent Billing"]
      operationId: bayarTagihanSewa
      summary: Penghuni membayar tagihan sewa via payment gateway, rekonsiliasi, lalu dicatat sebagai pemasukan di laporan kas pemilik
      parameters:
        - $ref: "#/components/parameters/IdTagihanSewa"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BayarRequest" }
      responses:
        "200":
          description: Hasil pembayaran (berhasil atau gagal)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BayarSewaResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /tagihan-sewa:
    get:
      tags: ["Entity: Rent Invoice"]
      operationId: listTagihanSewa
      summary: Daftar tagihan sewa (penghuni miliknya, pemilik propertinya)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagihanSewa" }

  /tagihan-sewa/{id_tagihan}:
    get:
      tags: ["Entity: Rent Invoice"]
      operationId: getTagihanSewa
      summary: Get Tagihan Sewa beserta riwayat percobaan pembayaran
      parameters:
        - $ref: "#/components/parameters/IdTagihanSewa"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagihanSewa" }
        "404": { $ref: "#/components/responses/Error" }

  /invoice:
    get:
      tags: ["Entity: Invoice"]
      operationId: listInvoice
      summary: Daftar invoice perbaikan yang ditagihkan ke pemilik (properti miliknya)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }

  /invoice/{id_invoice}:
    get:
      tags: ["Entity: Invoice"]
      operationId: getInvoice
      summary: Get Invoice beserta riwayat percobaan pembayaran
      parameters:
        - $ref: "#/components/parameters/IdInvoice"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { $ref: "#/components/responses/Error" }

  /laporan-kas:
    get:
      tags: ["Entity: Financial Ledger"]
      operationId: getLaporanKas
      summary: Get Laporan Kas pemilik (pemasukan sewa, pengeluaran perbaikan, bagian teknisi, komisi)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaporanKas" }
        "403": { $ref: "#/components/responses/Error" }

  /penghuni/me:
    get:
      tags: ["Entity: Tenant and Lease"]
      operationId: getPenghuniSaya
      summary: Get ID Penghuni + Get ID Unit untuk pengguna yang login
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilPenghuni" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /pemilik/unit:
    get:
      tags: ["Entity: Tenant and Lease"]
      operationId: listUnitPemilik
      summary: Daftar unit di properti milik pemilik yang login, beserta penghuni dan sewa yang sedang aktif
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UnitPemilik" }
        "403": { $ref: "#/components/responses/Error" }

  /pemilik/penghuni:
    get:
      tags: ["Entity: Tenant and Lease"]
      operationId: listPenghuniTerdaftar
      summary: Daftar penghuni yang pernah atau sedang menyewa unit di properti milik pemilik
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PenghuniTerdaftar" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: ["Entity: Tenant and Lease"]
      operationId: addPenghuni
      summary: >-
        Pemilik mendaftarkan penghuni baru (email Google + unit + periode sewa).
        Setelah terdaftar, penghuni bisa login dengan akun Google dari email tersebut.
        409 EMAIL_SUDAH_TERDAFTAR atau UNIT_SUDAH_DISEWA (periode bertabrakan dengan sewa lain).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PenghuniBaruRequest" }
      responses:
        "201":
          description: Terdaftar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PenghuniTerdaftar" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /pemilik/penghuni/{id_pengguna}:
    patch:
      tags: ["Entity: Tenant and Lease"]
      operationId: ubahPenghuni
      summary: >-
        Koreksi nama, email, atau nomor WhatsApp penghuni. Email hanya bisa diubah selama
        penghuni belum pernah login Google (409 SUDAH_TERHUBUNG).
      parameters:
        - name: id_pengguna
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UbahPenghuniRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PenghuniTerdaftar" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /pemilik/penghuni/{id_pengguna}/sewa:
    post:
      tags: ["Entity: Tenant and Lease"]
      operationId: addSewaPenghuni
      summary: >-
        Sewa baru untuk penghuni yang sudah terdaftar (perpanjang atau pindah unit), tanpa membuat akun baru.
        409 UNIT_SUDAH_DISEWA bila unit terisi pada periode itu, 409 SEWA_BENTROK bila penghuni masih punya
        sewa lain pada periode yang sama.
      parameters:
        - name: id_pengguna
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SewaBaruRequest" }
      responses:
        "201":
          description: Sewa dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PenghuniTerdaftar" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /unit/{id_unit}/sewa:
    get:
      tags: ["Entity: Tenant and Lease"]
      operationId: getStatusSewa
      summary: >-
        Get Status Sewa sebuah unit (sewa terbaru). Hanya pemilik unit atau penghuni yang pernah menyewa
        unit itu; selain itu 404.
      parameters:
        - name: id_unit
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSewa" }
        "404": { $ref: "#/components/responses/Error" }

  /tiket:
    get:
      tags: ["Entity: Complaint Ticket"]
      operationId: listTiket
      summary: Daftar tiket (penghuni melihat miliknya, pemilik melihat properti miliknya)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TiketRingkas" }

  /tiket/{id_tiket}:
    get:
      tags: ["Entity: Complaint Ticket"]
      operationId: getTiket
      summary: Get Tiket beserta keluhan, lampiran, dan riwayat status
      parameters:
        - $ref: "#/components/parameters/IdTiket"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TiketDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /keluhan/{id_keluhan}:
    get:
      tags: ["Entity: Complaint Ticket"]
      operationId: getKeluhan
      summary: Get Keluhan
      parameters:
        - name: id_keluhan
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Keluhan" }
        "404": { $ref: "#/components/responses/Error" }

  /media:
    post:
      tags: ["Utility: Media Storage"]
      operationId: addLampiranMedia
      summary: Simpan satu file media dan kembalikan URL-nya
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Tersimpan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lampiran" }
        "422": { $ref: "#/components/responses/Error" }

  /klasifikasi:
    post:
      tags: ["Utility: AI Classification"]
      operationId: classifyKeluhan
      summary: Klasifikasi kategori dan urgensi dari teks dan gambar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KlasifikasiRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KlasifikasiResponse" }

  /notifikasi:
    get:
      tags: ["Utility: Notification"]
      operationId: listNotifikasiSaya
      summary: Outbox notifikasi untuk pengguna yang login
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notifikasi" }

  /dev/reset:
    post:
      tags: [Dev (demo)]
      operationId: resetDataDemo
      security: []
      summary: Hapus semua data lalu isi ulang data seed demo. Hanya tersedia bila DEMO_MODE=true
      responses:
        "204":
          description: Data demo sudah dikembalikan ke kondisi awal
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdTiket:
      name: id_tiket
      in: path
      required: true
      schema: { type: integer }
    IdWorkOrder:
      name: id_work_order
      in: path
      required: true
      schema: { type: integer }
    IdTagihanSewa:
      name: id_tagihan
      in: path
      required: true
      schema: { type: integer }
    IdInvoice:
      name: id_invoice
      in: path
      required: true
      schema: { type: integer }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Role:
      type: string
      enum: [penghuni, pemilik, teknisi]
    StatusTiket:
      type: string
      enum: [dibuat, diklasifikasi, diproses, selesai, dibatalkan]
    Kategori:
      type: string
      enum: [AC, listrik, air, lainnya]
    Urgensi:
      type: string
      enum: [rendah, sedang, tinggi]
    Layer:
      type: string
      enum: [Task, Micro, Entity, Utility]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kode, pesan]
          properties:
            kode: { type: string, examples: [SEWA_TIDAK_AKTIF] }
            pesan: { type: string }

    Pengguna:
      type: object
      required: [id, nama, role]
      properties:
        id: { type: integer }
        nama: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    PenggunaSaya:
      type: object
      required: [id, nama, role, email]
      properties:
        id: { type: integer }
        nama: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        email: { type: string, format: email }

    UnitPemilik:
      type: object
      required: [id, nomor_unit, nama_properti, harga_bulanan, penghuni, sewa]
      properties:
        id: { type: integer }
        nomor_unit: { type: string, examples: [A-102] }
        nama_properti: { type: string, examples: [Kos Melati] }
        harga_bulanan: { type: integer, examples: [1200000] }
        penghuni:
          description: Penghuni dengan sewa aktif hari ini. null bila unit kosong
          oneOf:
            - { $ref: "#/components/schemas/Pengguna" }
            - { type: "null" }
        sewa:
          description: Sewa aktif hari ini. null bila unit kosong
          oneOf:
            - { $ref: "#/components/schemas/StatusSewa" }
            - { type: "null" }

    PenghuniTerdaftar:
      type: object
      required: [pengguna, email, no_wa, unit, sewa, terhubung_google]
      properties:
        pengguna: { $ref: "#/components/schemas/Pengguna" }
        email: { type: string, format: email }
        no_wa: { type: string, examples: [0812-3456-7890] }
        unit: { $ref: "#/components/schemas/UnitRingkas" }
        sewa: { $ref: "#/components/schemas/StatusSewa" }
        terhubung_google:
          type: boolean
          description: true bila penghuni sudah pernah login dengan akun Google dari email ini

    PenghuniBaruRequest:
      type: object
      required: [nama, email, no_wa, id_unit, tanggal_mulai, tanggal_selesai]
      properties:
        nama: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        no_wa: { type: string, minLength: 8, maxLength: 20 }
        id_unit: { type: integer }
        tanggal_mulai: { type: string, format: date }
        tanggal_selesai: { type: string, format: date }

    SewaBaruRequest:
      type: object
      required: [id_unit, tanggal_mulai, tanggal_selesai]
      properties:
        id_unit: { type: integer }
        tanggal_mulai: { type: string, format: date }
        tanggal_selesai: { type: string, format: date }

    UbahPenghuniRequest:
      type: object
      minProperties: 1
      properties:
        nama: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        no_wa: { type: string, minLength: 8, maxLength: 20 }

    AkunDemo:
      type: object
      required: [pengguna, keterangan, label_sewa]
      properties:
        pengguna: { $ref: "#/components/schemas/Pengguna" }
        keterangan: { type: string, examples: ["Kos Melati · A-101"] }
        label_sewa:
          type: string
          enum: [aktif, berakhir, pemilik, teknisi]
        jumlah_properti: { type: [integer, "null"] }

    DemoLoginRequest:
      type: object
      required: [id_pengguna]
      properties:
        id_pengguna: { type: integer }

    LoginResponse:
      type: object
      required: [token, pengguna]
      properties:
        token: { type: string }
        pengguna: { $ref: "#/components/schemas/Pengguna" }

    UnitRingkas:
      type: object
      required: [id, nomor_unit, nama_properti]
      properties:
        id: { type: integer }
        nomor_unit: { type: string, examples: [A-101] }
        nama_properti: { type: string, examples: [Kos Melati] }

    StatusSewa:
      type: object
      required: [id_unit, status_sewa, tanggal_mulai, tanggal_selesai]
      properties:
        id_unit: { type: integer }
        status_sewa:
          type: string
          enum: [aktif, tidak_aktif]
        tanggal_mulai: { type: string, format: date }
        tanggal_selesai: { type: string, format: date }

    ProfilPenghuni:
      type: object
      required: [pengguna, unit, sewa]
      properties:
        pengguna: { $ref: "#/components/schemas/Pengguna" }
        unit: { $ref: "#/components/schemas/UnitRingkas" }
        sewa: { $ref: "#/components/schemas/StatusSewa" }

    KeluhanRequest:
      type: object
      required: [deskripsi]
      properties:
        deskripsi: { type: string, minLength: 10, maxLength: 1000 }
        lampiran:
          type: array
          maxItems: 3
          items: { type: string, format: binary }

    Lampiran:
      type: object
      required: [id, url, nama_file, mime, ukuran_byte]
      properties:
        id: { type: integer }
        url: { type: string }
        nama_file: { type: string }
        mime: { type: string, examples: [image/jpeg, video/mp4] }
        ukuran_byte: { type: integer }

    Keluhan:
      type: object
      required: [id, kode, id_penghuni, id_unit, deskripsi, status, alasan_penolakan, lampiran, created_at]
      properties:
        id: { type: integer }
        kode: { type: string, examples: [KLH-0101] }
        id_penghuni: { type: integer }
        id_unit: { type: integer }
        deskripsi: { type: string }
        status:
          type: string
          enum: [diterima, ditolak]
        alasan_penolakan: { type: [string, "null"] }
        lampiran:
          type: array
          items: { $ref: "#/components/schemas/Lampiran" }
        created_at: { type: string, format: date-time }

    TiketRingkas:
      type: object
      required: [id, kode, judul, status, kategori, urgensi, perlu_review, penanganan, unit, penghuni, created_at, updated_at]
      properties:
        id: { type: integer }
        kode: { type: string, examples: [TKT-0055] }
        judul: { type: string, examples: ["AC tidak dingin, air menetes"] }
        status: { $ref: "#/components/schemas/StatusTiket" }
        kategori:
          oneOf:
            - $ref: "#/components/schemas/Kategori"
            - type: "null"
        urgensi:
          oneOf:
            - $ref: "#/components/schemas/Urgensi"
            - type: "null"
        perlu_review: { type: boolean }
        penanganan:
          description: Cara tiket diselesaikan. null selama belum selesai
          oneOf:
            - $ref: "#/components/schemas/Penanganan"
            - type: "null"
        unit: { $ref: "#/components/schemas/UnitRingkas" }
        penghuni: { $ref: "#/components/schemas/Pengguna" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Penanganan:
      type: string
      enum: [sendiri, teknisi]

    RiwayatStatus:
      type: object
      required: [dari, ke, waktu, oleh, catatan]
      properties:
        dari:
          oneOf:
            - $ref: "#/components/schemas/StatusTiket"
            - type: "null"
        ke: { $ref: "#/components/schemas/StatusTiket" }
        waktu: { type: string, format: date-time }
        oleh: { type: string, examples: [sistem, Pak Hendra] }
        catatan: { type: [string, "null"], description: "Catatan pemilik saat menutup/membatalkan, atau alasan penghuni membuka ulang" }

    TiketDetail:
      allOf:
        - $ref: "#/components/schemas/TiketRingkas"
        - type: object
          required: [keluhan, ai_confidence, ai_alasan, riwayat, catatan_penanganan, bisa_dibuka_ulang]
          properties:
            keluhan: { $ref: "#/components/schemas/Keluhan" }
            catatan_penanganan: { type: [string, "null"], description: Catatan pemilik saat menangani sendiri }
            bisa_dibuka_ulang: { type: boolean, description: "Penghuni masih boleh membuka ulang (ditangani sendiri, ≤ 7 hari)" }
            ai_confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
            ai_alasan: { type: [string, "null"] }
            riwayat:
              type: array
              items: { $ref: "#/components/schemas/RiwayatStatus" }

    TraceStep:
      type: object
      required: [service, layer, operasi, ok, ms]
      properties:
        service: { type: string, examples: [Tenant and Lease] }
        layer: { $ref: "#/components/schemas/Layer" }
        operasi: { type: string, examples: ["getStatusSewa(unit=7) → aktif"] }
        ok: { type: boolean }
        ms: { type: number }

    KeluhanResponse:
      type: object
      required: [hasil, keluhan, tiket, alasan, warning, trace]
      properties:
        hasil:
          type: string
          enum: [diterima, ditolak]
        keluhan: { $ref: "#/components/schemas/Keluhan" }
        tiket:
          oneOf:
            - $ref: "#/components/schemas/TiketDetail"
            - type: "null"
        alasan: { type: [string, "null"], description: Alasan penolakan bila ditolak }
        sewa:
          oneOf:
            - $ref: "#/components/schemas/StatusSewa"
            - type: "null"
        warning: { type: [string, "null"], description: "Contoh: klasifikasi AI gagal, tiket tetap dibuat" }
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }

    UbahStatusRequest:
      type: object
      description: >-
        Tiket diproses lewat persetujuan estimasi biaya (pemilik memanggil teknisi). Endpoint ini dipakai pemilik
        untuk menutup tiket tanpa teknisi (selesai, hanya dari status diklasifikasi, tanpa biaya) atau membatalkannya.
      required: [status]
      properties:
        status:
          type: string
          enum: [selesai, dibatalkan]
        catatan: { type: string, maxLength: 300, description: "Alasan untuk penghuni, mis. sudah ditangani sendiri" }

    BukaUlangRequest:
      type: object
      required: [alasan]
      properties:
        alasan: { type: string, minLength: 5, maxLength: 300 }

    KlasifikasiRequest:
      type: object
      required: [teks]
      properties:
        teks: { type: string }
        media_url:
          type: array
          items: { type: string }

    KlasifikasiResponse:
      type: object
      required: [kategori, urgensi, confidence, alasan, judul]
      properties:
        kategori: { $ref: "#/components/schemas/Kategori" }
        urgensi: { $ref: "#/components/schemas/Urgensi" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        alasan: { type: string }
        judul: { type: string, description: Ringkasan singkat keluhan untuk judul tiket }

    Notifikasi:
      type: object
      required: [id, kode_tiket, jenis, isi, kanal, no_tujuan, status_kirim, created_at]
      properties:
        id: { type: integer }
        kode_tiket: { type: string }
        jenis:
          type: string
          enum:
            - tiket_dibuat
            - diklasifikasi
            - prioritas_tinggi
            - diproses
            - dibatalkan
            - estimasi
            - teknisi_ditugaskan
            - jadwal
            - progres
            - bukti_valid
            - bukti_ditolak
            - selesai
            - invoice
            - lunas
            - bayar_gagal
        isi: { type: string }
        kanal:
          type: string
          enum: [whatsapp]
        no_tujuan: { type: string }
        status_kirim:
          type: string
          enum: [terkirim, gagal]
        created_at: { type: string, format: date-time }

    StatusWorkOrder:
      type: string
      description: menunggu_pemilik = penghuni sudah mengonfirmasi beres, menunggu pemilik menerima hasil
      enum: [menunggu_jadwal, dijadwalkan, dikerjakan, menunggu_konfirmasi, menunggu_pemilik, selesai, dibatalkan]
    MetodePembayaran:
      type: string
      enum: [qris, va_bca, va_mandiri, gopay]

    RincianBiaya:
      type: object
      required: [label, jumlah]
      properties:
        label: { type: string, examples: ["Jasa perbaikan listrik"] }
        jumlah: { type: integer, description: Rupiah }

    TeknisiRingkas:
      type: object
      required: [id, nama, keahlian, terverifikasi, rating, no_wa]
      properties:
        id: { type: integer }
        nama: { type: string }
        keahlian:
          type: array
          items: { $ref: "#/components/schemas/Kategori" }
        terverifikasi: { type: boolean }
        rating: { type: number }
        no_wa: { type: string }

    KandidatTeknisi:
      type: object
      description: Hasil Technician Matching untuk satu teknisi (lolos atau alasan tidak lolos)
      required: [teknisi, tersedia, jarak_km, lolos, skor, alasan]
      properties:
        teknisi: { $ref: "#/components/schemas/TeknisiRingkas" }
        tersedia: { type: boolean }
        jarak_km: { type: number }
        lolos: { type: boolean }
        skor: { type: [number, "null"] }
        alasan: { type: string, examples: ["Belum terverifikasi"] }

    EstimasiBiaya:
      type: object
      required: [id, id_tiket, kode_tiket, teknisi, kandidat, rincian, total, status, diputuskan_oleh, diputuskan_at, created_at]
      properties:
        id: { type: integer }
        id_tiket: { type: integer }
        kode_tiket: { type: string }
        teknisi: { $ref: "#/components/schemas/TeknisiRingkas" }
        kandidat:
          type: array
          items: { $ref: "#/components/schemas/KandidatTeknisi" }
        rincian:
          type: array
          items: { $ref: "#/components/schemas/RincianBiaya" }
        total: { type: integer }
        status:
          type: string
          enum: [menunggu, disetujui, ditolak]
        diputuskan_oleh: { type: [string, "null"] }
        diputuskan_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    EstimasiResponse:
      type: object
      required: [estimasi, trace]
      properties:
        estimasi: { $ref: "#/components/schemas/EstimasiBiaya" }
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }

    PersetujuanRequest:
      type: object
      required: [disetujui]
      properties:
        disetujui: { type: boolean }

    PersetujuanResponse:
      type: object
      required: [estimasi, tiket, work_order, trace]
      properties:
        estimasi: { $ref: "#/components/schemas/EstimasiBiaya" }
        tiket: { $ref: "#/components/schemas/TiketDetail" }
        work_order:
          oneOf:
            - $ref: "#/components/schemas/WorkOrder"
            - type: "null"
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }

    LogServis:
      type: object
      required: [aktivitas, catatan, waktu, oleh]
      properties:
        aktivitas:
          type: string
          enum:
            - dibuat
            - jadwal
            - tiba
            - mulai
            - catatan
            - bukti_valid
            - bukti_ditolak
            - belum_beres
            - dikonfirmasi_penghuni
            - perbaikan_ulang
            - biaya_tambahan
            - biaya_tambahan_disetujui
            - biaya_tambahan_ditolak
            - selesai
            - dibatalkan
        catatan: { type: [string, "null"] }
        waktu: { type: string, format: date-time }
        oleh: { type: string }

    VerifikasiBukti:
      type: object
      required: [valid, skor, pemeriksaan]
      properties:
        valid: { type: boolean }
        skor: { type: number, minimum: 0, maximum: 1 }
        pemeriksaan:
          type: array
          items:
            type: object
            required: [label, ok]
            properties:
              label: { type: string }
              ok: { type: boolean }

    WorkOrder:
      type: object
      required: [id, kode, id_tiket, kode_tiket, judul, kategori, urgensi, unit, penghuni, teknisi, status, biaya_final, biaya_tambahan, slot_jadwal, jadwal_kunjungan, log, bukti_sebelum, bukti_sesudah, verifikasi, id_invoice, created_at, updated_at]
      properties:
        id: { type: integer }
        kode: { type: string, examples: [WO-0012] }
        id_tiket: { type: integer }
        kode_tiket: { type: string }
        judul: { type: string }
        kategori:
          oneOf:
            - $ref: "#/components/schemas/Kategori"
            - type: "null"
        urgensi:
          oneOf:
            - $ref: "#/components/schemas/Urgensi"
            - type: "null"
        unit: { $ref: "#/components/schemas/UnitRingkas" }
        penghuni: { $ref: "#/components/schemas/Pengguna" }
        teknisi: { $ref: "#/components/schemas/TeknisiRingkas" }
        status: { $ref: "#/components/schemas/StatusWorkOrder" }
        biaya_final: { type: integer, description: Estimasi disetujui + biaya tambahan yang disetujui }
        biaya_tambahan:
          type: array
          items: { $ref: "#/components/schemas/BiayaTambahan" }
        slot_jadwal:
          type: array
          description: Usulan waktu kunjungan yang bisa dipilih penghuni
          items: { type: string, format: date-time }
        jadwal_kunjungan: { type: [string, "null"], format: date-time }
        log:
          type: array
          items: { $ref: "#/components/schemas/LogServis" }
        bukti_sebelum:
          oneOf:
            - $ref: "#/components/schemas/Lampiran"
            - type: "null"
        bukti_sesudah:
          oneOf:
            - $ref: "#/components/schemas/Lampiran"
            - type: "null"
        verifikasi:
          oneOf:
            - $ref: "#/components/schemas/VerifikasiBukti"
            - type: "null"
        id_invoice: { type: [integer, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BiayaTambahan:
      type: object
      required: [id, alasan, jumlah, status, diajukan_at, diputuskan_at]
      properties:
        id: { type: integer }
        alasan: { type: string, examples: ["Kabel di dalam dinding ikut terbakar, perlu diganti 3 meter"] }
        jumlah: { type: integer, description: Rupiah }
        status:
          type: string
          enum: [menunggu, disetujui, ditolak]
        diajukan_at: { type: string, format: date-time }
        diputuskan_at: { type: [string, "null"], format: date-time }

    BiayaTambahanRequest:
      type: object
      required: [alasan, jumlah]
      properties:
        alasan: { type: string, minLength: 5, maxLength: 200 }
        jumlah: { type: integer, minimum: 1000, maximum: 5000000 }

    PenerimaanRequest:
      type: object
      required: [diterima]
      properties:
        diterima: { type: boolean, description: false = minta teknisi memperbaiki ulang }
        catatan: { type: string, maxLength: 300 }

    JadwalRequest:
      type: object
      required: [jadwal]
      properties:
        jadwal: { type: string, format: date-time }

    LogRequest:
      type: object
      required: [aktivitas]
      properties:
        aktivitas:
          type: string
          enum: [tiba, mulai, catatan]
        catatan: { type: string, maxLength: 300 }

    BuktiRequest:
      type: object
      required: [sebelum, sesudah]
      properties:
        sebelum: { type: string, format: binary }
        sesudah: { type: string, format: binary }

    BuktiResponse:
      type: object
      required: [work_order, verifikasi, trace]
      properties:
        work_order: { $ref: "#/components/schemas/WorkOrder" }
        verifikasi: { $ref: "#/components/schemas/VerifikasiBukti" }
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }

    KonfirmasiRequest:
      type: object
      required: [selesai]
      properties:
        selesai: { type: boolean }
        catatan: { type: string, maxLength: 300 }

    KonfirmasiResponse:
      type: object
      required: [work_order, tiket, invoice, trace]
      properties:
        work_order: { $ref: "#/components/schemas/WorkOrder" }
        tiket: { $ref: "#/components/schemas/TiketDetail" }
        invoice:
          oneOf:
            - $ref: "#/components/schemas/Invoice"
            - type: "null"
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }

    Pembayaran:
      type: object
      required: [id, ref_gateway, metode, jumlah, status, alasan_gagal, direkonsiliasi, created_at]
      properties:
        id: { type: integer }
        ref_gateway: { type: string, examples: [PG-8F3K2Q] }
        metode: { $ref: "#/components/schemas/MetodePembayaran" }
        jumlah: { type: integer }
        status:
          type: string
          enum: [pending, berhasil, gagal]
        alasan_gagal: { type: [string, "null"] }
        direkonsiliasi: { type: boolean }
        created_at: { type: string, format: date-time }

    Invoice:
      type: object
      required: [id, kode, id_work_order, id_tiket, kode_tiket, judul, unit, penghuni, pemilik, teknisi, rincian, biaya, persen_komisi, komisi, total, status, terlambat, jenis, jatuh_tempo, dibayar_at, pembayaran, created_at]
      properties:
        id: { type: integer }
        kode: { type: string, examples: [INV-0012] }
        id_work_order: { type: integer }
        id_tiket: { type: integer }
        kode_tiket: { type: string }
        judul: { type: string }
        unit: { $ref: "#/components/schemas/UnitRingkas" }
        penghuni: { $ref: "#/components/schemas/Pengguna", description: Pelapor keluhan }
        pemilik: { $ref: "#/components/schemas/Pengguna", description: Yang ditagih dan membayar }
        teknisi: { type: string }
        rincian:
          type: array
          items: { $ref: "#/components/schemas/RincianBiaya" }
        biaya: { type: integer, description: Biaya final perbaikan }
        persen_komisi: { type: number, examples: [10] }
        komisi: { type: integer, description: Komisi Kosmos, dipotong dari bagian teknisi }
        total: { type: integer, description: Yang dibayar pemilik }
        status:
          type: string
          enum: [belum_dibayar, lunas]
        terlambat: { type: boolean, description: Belum dibayar dan sudah melewati jatuh tempo }
        jenis:
          type: string
          description: perbaikan = hasil diterima pemilik; kunjungan = tiket dibatalkan setelah teknisi tiba
          enum: [perbaikan, kunjungan]
        jatuh_tempo: { type: string, format: date }
        dibayar_at: { type: [string, "null"], format: date-time }
        pembayaran:
          type: array
          items: { $ref: "#/components/schemas/Pembayaran" }
        created_at: { type: string, format: date-time }

    BayarRequest:
      type: object
      required: [metode]
      properties:
        metode: { $ref: "#/components/schemas/MetodePembayaran" }
        simulasi_gagal: { type: boolean, description: Khusus demo, payment gateway mock menolak transaksi }

    BayarResponse:
      type: object
      required: [hasil, invoice, pembayaran, alasan, trace]
      properties:
        hasil:
          type: string
          enum: [berhasil, gagal]
        invoice: { $ref: "#/components/schemas/Invoice" }
        pembayaran: { $ref: "#/components/schemas/Pembayaran" }
        alasan: { type: [string, "null"] }
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }

    BayarSekaligusRequest:
      type: object
      required: [id_invoice, metode]
      properties:
        id_invoice:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: integer }
        metode: { $ref: "#/components/schemas/MetodePembayaran" }
        simulasi_gagal: { type: boolean, description: Khusus demo, payment gateway mock menolak transaksi }

    BayarSekaligusResponse:
      type: object
      required: [hasil, invoice, ref_gateway, total, alasan, trace]
      properties:
        hasil:
          type: string
          enum: [berhasil, gagal]
        invoice:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }
        ref_gateway: { type: string, description: Satu transaksi gateway untuk semua invoice }
        total: { type: integer }
        alasan: { type: [string, "null"] }
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }

    TagihanSewa:
      type: object
      required: [id, kode, periode, unit, penghuni, jumlah, status, terlambat, jatuh_tempo, dibayar_at, pembayaran, created_at]
      properties:
        id: { type: integer }
        kode: { type: string, examples: [SWA-0012] }
        periode: { type: string, pattern: "^\\d{4}-\\d{2}$", examples: ["2026-11"], description: Bulan sewa (YYYY-MM) }
        unit: { $ref: "#/components/schemas/UnitRingkas" }
        penghuni: { $ref: "#/components/schemas/Pengguna" }
        jumlah: { type: integer, description: Harga sewa bulanan unit (Rupiah) }
        status:
          type: string
          enum: [belum_dibayar, lunas]
        terlambat: { type: boolean }
        jatuh_tempo: { type: string, format: date }
        dibayar_at: { type: [string, "null"], format: date-time }
        pembayaran:
          type: array
          items: { $ref: "#/components/schemas/Pembayaran" }
        created_at: { type: string, format: date-time }

    TerbitkanSewaResponse:
      type: object
      required: [periode, dibuat, trace]
      properties:
        periode: { type: string, examples: ["2026-11"] }
        dibuat:
          type: array
          items: { $ref: "#/components/schemas/TagihanSewa" }
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }

    BayarSewaResponse:
      type: object
      required: [hasil, tagihan, pembayaran, alasan, trace]
      properties:
        hasil:
          type: string
          enum: [berhasil, gagal]
        tagihan: { $ref: "#/components/schemas/TagihanSewa" }
        pembayaran: { $ref: "#/components/schemas/Pembayaran" }
        alasan: { type: [string, "null"] }
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }

    TransaksiKas:
      type: object
      required: [id, waktu, jenis, keterangan, jumlah, ref, properti]
      properties:
        id: { type: integer }
        waktu: { type: string, format: date-time }
        jenis:
          type: string
          description: sewa = pemasukan dari penghuni; pembayaran_teknisi dan komisi = pengeluaran perbaikan
          enum: [sewa, pembayaran_teknisi, komisi]
        keterangan: { type: string }
        jumlah: { type: integer, description: Positif = uang masuk ke pemilik, negatif = uang keluar }
        ref: { type: string, examples: [INV-0012] }
        properti: { type: string }

    LaporanKas:
      type: object
      required: [ringkasan, transaksi]
      properties:
        ringkasan:
          type: object
          required:
            - pemasukan_sewa
            - pengeluaran
            - saldo
            - pembayaran_teknisi
            - komisi
            - invoice_lunas
            - invoice_tertunda
            - invoice_terlambat
            - nilai_tertunda
            - sewa_tertunda
            - nilai_sewa_tertunda
          properties:
            pemasukan_sewa: { type: integer, description: Total sewa yang sudah dibayar penghuni }
            saldo: { type: integer, description: pemasukan_sewa - pengeluaran }
            sewa_tertunda: { type: integer, description: Jumlah tagihan sewa belum dibayar }
            nilai_sewa_tertunda: { type: integer }
            pengeluaran: { type: integer, description: Total biaya perbaikan yang sudah dibayar pemilik }
            pembayaran_teknisi: { type: integer }
            komisi: { type: integer }
            invoice_lunas: { type: integer }
            invoice_tertunda: { type: integer }
            invoice_terlambat: { type: integer }
            nilai_tertunda: { type: integer }
        transaksi:
          type: array
          items: { $ref: "#/components/schemas/TransaksiKas" }
