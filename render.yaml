# Render Blueprint untuk backend Kosmos (FastAPI).
# Nilai bertanda sync: false diisi manual di dashboard Render, tidak pernah ditulis di file ini.
services:
  - type: web
    name: kosmos-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: kosmos-media
      - key: DEMO_JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: AI_PROVIDER
        value: mock
      - key: WA_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
