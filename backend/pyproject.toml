[project]
name = "kosmos-backend"
version = "0.1.0"
description = "Backend FastAPI Kosmos: service SOA (Task, Micro, Entity, Utility) untuk Complaint Handling, Repair Verification, Billing & Commission"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
]
